name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチへ続けて push したときは、古い実行を打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      # 片方の Node で失敗しても、もう片方の結果は見たい。
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # package-lock.json との不一致もここで落ちる。
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # コンパイルは pretest が走らせる。テストには
      # キーバインドの妥当性やレイヤ違反を見る構造テストも含まれる。
      - name: Test
        run: npm test
