# 開発と CI で同じ Node を使うための固定。
#
# package.json の engines.node (>=22.6) は「動く下限」の宣言で、こちらは
# 「実際に検証している版」です。テストの実行に使う node --test のグロブ指定が
# Node 22.6 以降の機能なので、下限はそこから動かせません。
#
# CI もこのファイルを読みます (.github/workflows/ci.yml の jdx/mise-action)。
# 版を上げるときは、ここを書き換えて npm run lint / typecheck / test を通してください。

[tools]
node = "22.23.2"
